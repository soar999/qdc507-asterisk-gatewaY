[general]
interval=15

[defaults]
msg_storage=auto
autodeletesms=yes
context=incoming-mobile
group=0
resetmodem=no
initstate=start
query_time=no
dsci=off
qhup=off

[quectel0]
data=/dev/ttyUSB0
uac=ext
alsadev=hw:0
slin16=no
; Direct SMS delivery: AT+CNMI=2,2,2,0 (new SMS pushed to port, not stored)
msg_direct=off
